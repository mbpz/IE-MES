name: ie-mes
services:
  db:
    image: mysql:8.0.44
    command:
      - --default-authentication-plugin=mysql_native_password
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: iemes_v1
      MYSQL_USER: iemes
      MYSQL_PASSWORD: ${IEMES_DB_PASSWORD:?Set IEMES_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${IEMES_DB_ROOT_PASSWORD:?Set IEMES_DB_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    volumes:
      - database:/var/lib/mysql
      - ./src/main/webapp/dbscript/iemes_v1.sql:/docker-entrypoint-initdb.d/001-original.sql:ro
      - ./docker/sql/002-runtime-tables.sql:/docker-entrypoint-initdb.d/002-runtime-tables.sql:ro
      - ./docker/sql/003-erp-delivery.sql:/docker-entrypoint-initdb.d/003-erp-delivery.sql:ro
      - ./docker/sql/004-station-events.sql:/docker-entrypoint-initdb.d/004-station-events.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -uiemes iemes_v1 -e "SELECT COUNT(*) FROM ly_resources; SELECT COUNT(*) FROM ly_sukey; SELECT COUNT(*) FROM ly_erp_order; SELECT COUNT(*) FROM ly_delivery_record; SELECT COUNT(*) FROM ly_station_event" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      IEMES_DB_PASSWORD: ${IEMES_DB_PASSWORD:?Set IEMES_DB_PASSWORD in .env}
      IEMES_ADMIN_PASSWORD: ${IEMES_ADMIN_PASSWORD:?Set a unique IEMES_ADMIN_PASSWORD in .env}
      IEMES_SMTP_HOST: mailpit
      IEMES_SMTP_PORT: "1025"
      TZ: Asia/Shanghai
      JAVA_OPTS: -Dfile.encoding=UTF-8 -Duser.timezone=Asia/Shanghai -Diemes.config.file=/var/lib/iemes/config.properties -Xms256m -Xmx1024m
    ports:
      - "127.0.0.1:${IEMES_HTTP_PORT:-18080}:8080"
    volumes:
      - uploads:/usr/local/tomcat/webapps/ROOT/uploadFile
      - configuration:/var/lib/iemes
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: [CMD, java, -cp, /opt/iemes, ContainerSupport, health]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
  mailpit:
    image: ${IEMES_MAILPIT_IMAGE:-axllent/mailpit:v1.32.0}
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:18025:8025"
    volumes:
      - mailbox:/data
    restart: unless-stopped
volumes:
  database:
  uploads:
  configuration:
  mailbox:
